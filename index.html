<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcat</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        img {
            max-width: 400px;
            width: 80vw;
            cursor: pointer;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <h1 id="count">0</h1>
    <img id="popcat" src="https://i.imgur.com/7X563k7.png" alt="Popcat Closed" onclick="pop(true)" ontouchstart="pop(true)" onmouseup="pop(false)" ontouchend="pop(false)">

    <script>
        let score = 0;
        const countDisplay = document.getElementById('count');
        const catImage = document.getElementById('popcat');

        // 입 벌린 이미지와 다문 이미지 (Imgur 링크 등 활용)
        const imgClosed = "https://i.imgur.com/7X563k7.png";
        const imgOpen = "https://i.imgur.com/9563k7.png"; // 실제 팝켓 오픈 이미지 URL로 교체 가능

        function pop(isOpened) {
            if (isOpened) {
                score++;
                countDisplay.textContent = score;
                catImage.src = imgOpen;
            } else {
                catImage.src = imgClosed;
            }
        }
    </script>
</body>
</html>
