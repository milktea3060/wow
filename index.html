<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcat</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #141414;
            font-family: "굴림", Gulim, "맑은 고딕", "Malgun Gothic", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        img {
            max-width: 400px;
            width: 80vw;
            cursor: pointer;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>

    <h1 id="count">0</h1>
    <img id="popcat" src="closed.png" alt="Popcat" 
         onmousedown="openMouth()" 
         onmouseup="closeMouth()" 
         onmouseleave="closeMouth()"
         ontouchstart="openMouth()" 
         ontouchend="closeMouth()">

    <script>
        let score = 0;
        const countDisplay = document.getElementById('count');
        const catImage = document.getElementById('popcat');

        const imgClosed = "closed.png";
        const imgOpen = "open.png";

        function openMouth() {
            score++;
            countDisplay.textContent = score;
            catImage.src = imgOpen;
        }

        function closeMouth() {
            catImage.src = imgClosed;
        }
    </script>
</body>
</html>
