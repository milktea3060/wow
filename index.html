<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Popcat</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        img {
            max-width: 400px;
            width: 80vw;
            cursor: pointer;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <h1 id="count">0</h1>
    <!-- 초기 이미지를 closed.png로 설정 -->
    <img id="popcat" src="closed.png" alt="Popcat" onclick="pop(true)" ontouchstart="pop(true)" onmouseup="pop(false)" ontouchend="pop(false)">

    <script>
        let score = 0;
        const countDisplay = document.getElementById('count');
        const catImage = document.getElementById('popcat');

        const imgClosed = "closed.png";
        const imgOpen = "open.png";

        function pop(isOpened) {
            if (isOpened) {
                score++;
                countDisplay.textContent = score;
                catImage.src = imgOpen;
            } else {
                catImage.src = imgClosed;
            }
        }
    </script>
</body>
</html>
