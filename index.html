<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcat Custom</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #141414;
            font-family: "굴림", Gulim, "맑은 고딕", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* UI와 카운트를 상단 중앙에 고정하는 컨테이너 */
        .fixed-header {
            position: fixed;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }

        /* Casio F-91W 아스키 아트 및 카운트 스타일 */
        #watch-container {
            font-family: monospace;
            white-space: pre;
            line-height: 1.1;
            font-size: 0.85rem;
            background: #c8d1c5;
            padding: 10px 15px;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            position: relative;
        }

        /* 시계 액정 안쪽 중앙에 숫자가 오도록 겹치는 스타일 */
        #count {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            font-family: "굴림", Gulim, monospace;
            color: #111;
            letter-spacing: 2px;
        }

        img {
            max-width: 400px;
            width: 80vw;
            cursor: pointer;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            z-index: 10;
            margin-top: 80px; /* 고정 헤더와 겹치지 않도록 여백 확보 */
        }

        /* 자동 클릭 설정 UI 스타일 */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        input {
            width: 60px;
            padding: 4px;
            text-align: center;
            font-family: inherit;
        }
        button {
            padding: 5px 12px;
            font-family: inherit;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button:hover {
            background-color: #e0e0e0;
        }

        /* 67 돌파 시 1초간 뜨는 텍스트 스타일 */
        #popup-text {
            position: fixed;
            top: 35%;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff3366;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border: 2px solid #ff3366;
            border-radius: 10px;
            display: none;
            z-index: 200;
            white-space: pre-wrap;
            text-align: center;
        }

        /* 무지개 스프링클러 파티클 스타일 */
        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            animation: burst 1s ease-out forwards;
            z-index: 150;
        }
        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 67 돌파 시 1초간 뜰 텍스트 -->
    <div id="popup-text">67 돌파 축하합니다!<br><span id="ascii-art" style="font-size: 0.7rem; line-height: 1.1; display:inline-block; margin-top:5px;"></span></div>

    <!-- 상단 고정 영역 (시계형 카운트 + 자동 클릭 UI) -->
    <div class="fixed-header">
        <div id="watch-container">
            +--------------------------+
            |           you are        |
            |                          |  
            |       boy (⌒▽⌒)                   |
            +--------------------------+
            <div id="count">0</div>
        </div>

        <div class="controls">
            <label for="interval">간격(ms):</label>
            <input type="number" id="interval" value="100" min="10" step="10">
            <button id="auto-btn" onclick="toggleAutoClick()">자동 클릭 시작</button>
        </div>
    </div>
    
    <img id="popcat" src="closed.png" alt="Popcat" 
         onmousedown="triggerPop(true)" 
         onmouseup="triggerPop(false)" 
         onmouseleave="triggerPop(false)"
         ontouchstart="triggerPop(true)" 
         ontouchend="triggerPop(false)">

    <script>
        let score = 0;
        let hasShown67 = false;
        let isAutoRunning = false;
        let autoTimer = null;

        const countDisplay = document.getElementById('count');
        const catImage = document.getElementById('popcat');
        const popupText = document.getElementById('popup-text');
        const asciiSpan = document.getElementById('ascii-art');
        const autoBtn = document.getElementById('auto-btn');
        const intervalInput = document.getElementById('interval');

        const rawAscii = `⠀⠀⢀⠤⣂⣤⣬⣭⣭⣭⣔⡠⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠔⣵⣾⣿⣿⣿⢿⣿⣿⣿⣿⣎⢂⠀⢲⣤⣤⣤⣤⣀⣒⣒⣒⣒⣂⡠⠤⠤⣄
⠐⣾⣿⣿⣿⡏⣾⡿⢎⣛⣫⣭⣴⣾⠆⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⢼
⡇⣿⣿⣿⣿⣟⡿⢀⣐⣻⣛⡩⢁⠀⠀⣘⣛⣛⡛⠿⠿⠿⢿⣿⣿⣿⣿⣿⢟⣾
⡇⣿⣿⣿⣿⣷⣾⣿⣿⣿⣿⣿⣶⡕⠄⠉⠛⠛⠛⠛⡻⣣⣾⣿⣿⣿⢟⣵⣿⠛
⠃⣿⣿⣿⣿⣿⢋⣥⠭⡻⣿⣿⣿⣿⡌⡄⠀⠀⠀⡐⣼⣿⣿⣿⡿⣣⣾⠏⠀⠀
⠨⢻⣿⣿⣿⣧⢻⠁⠀⠘⢸⣿⣿⣿⡇⣿⠀⠀⠌⣼⣿⣿⣿⡿⢱⣿⠃⠀⠀⠀
⠀⢦⢻⣿⣿⣿⣦⣐⣀⣊⣼⣿⣿⡿⢱⡿⠀⠰⣸⣿⣿⣿⣿⢣⣿⠃⠀⠀⠀⠀
⠀⠀⠣⣙⠿⣿⣿⣿⣿⣿⣿⠿⢛⣵⡿⠃⢀⢃⣿⣿⣿⣿⡟⣾⡇⠀⠀⠀⠀⠀
⠀⠀⠀⠈⠛⠶⣮⣭⣭⣴⣶⡿⠿⠋⠀⠀⢨⣘⣿⡻⠿⠿⢇⣿⠀⠀⠀⠀⠀⠀
⠀⠀⢀⠔⠒⠂⠠⠤⠭⡀⠀⠀⠀⠀⠀⠀⠀⠙⠛⠛⠛⠛⠻⠃⠀⠀⠀⠀⠀⠀
⢀⠆⠁⠀⡄⠀⠀⠀⠀⠈⢂⠀⠀⠀⠀⠀⠀⠀⠀⢀⡤⠒⠁⠀⠀⠒⢤⡀⠀⠀
⠣⠤⢤⠞⠂⠀⣀⠰⠃⠀⠘⣆⢀⣀⠀⠀⠀⠀⢀⠎⠀⢠⡀⠀⠀⠀⢀⠀⠙⡀
⠀⠀⢸⠀⠈⠭⡀⢈⣡⠔⢶⠁⣹⢩⠃⠀⢀⠀⢸⠀⠀⠀⣑⣠⣤⠀⠙⡦⣀⠜
⠀⠀⠀⠣⠀⢂⠞⠱⠴⣈⡸⠰⢇⠘⠀⠰⡭⠷⢝⡤⣂⣄⠒⢤⡐⠀⠀⡇⠀⠀
⠀⠀⠀⠀⠱⠄⣀⢜⢁⡠⠥⠊⠀⠀⠀⠀⠡⡘⡄⠐⡂⠘⢌⡀⠉⠂⡸⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠄⠹⢅⣀⠹⠒⠊⠀⠀⠀⠠`;
        asciiSpan.textContent = rawAscii;

        const imgClosed = "closed.png";
        const imgOpen = "open.png";
        function triggerPop(isOpened) {
            if (isOpened) {
                score++;
                countDisplay.textContent = score;
                catImage.src = imgOpen;

                if (score === 67 && !hasShown67) {
                    hasShown67 = true;
                    popupText.style.display = 'block';
                    setTimeout(() => { popupText.style.display = 'none'; }, 1000);
                }

                if (score === 4489) {
                    launchRainbowSprinkler();
                }
            } else {
                catImage.src = imgClosed;
            }
        }

        // 무지개 스프링클러 파티클 생성 함수
        function launchRainbowSprinkler() {
            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#ee82ee'];
            const x = window.innerWidth / 2;
            const y = window.innerHeight / 2;

            for (let i = 0; i < 120; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 300;
                particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }
        function toggleAutoClick() {
            if (!isAutoRunning) {
                let intervalTime = parseInt(intervalInput.value) || 100;
                if (intervalTime < 10) intervalTime = 10;
                
                isAutoRunning = true;
                autoBtn.textContent = "자동 클릭 정지";
                intervalInput.disabled = true;

                autoTimer = setInterval(() => {
                    triggerPop(true);
                    setTimeout(() => triggerPop(false), intervalTime / 2);
                }, intervalTime);
            } else {
                isAutoRunning = false;
                autoBtn.textContent = "자동 클릭 시작";
                intervalInput.disabled = false;
                clearInterval(autoTimer);
            }
        }
    </script>
</body>
</html>
